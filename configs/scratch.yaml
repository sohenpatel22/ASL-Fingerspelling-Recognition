# train from scratch with the ingredients the top Kaggle solutions used, on our hand landmarks:
# longer clips, heavy augmentation, CutMix, decoder input masking, joint CTC, weight averaging
model:
  max_seq_len: 192
  dropout: 0.1
  ctc: true

data:
  use_supplemental: true
  split_seed: 42
  augment: heavy
  cutmix: 0.5

train:
  batch_size: 96
  epochs: 16
  lr: 5.0e-4
  weight_decay: 0.05
  warmup_epochs: 2
  scheduler: cosine
  label_smoothing: 0.0
  decoder_mask: 0.2
  ctc_weight: 0.25
  ema_decay: 0.999
  patience: 8
  eval_samples: 1000
  num_workers: 4
  init_from: null
  out_dir: checkpoints/scratch
