# v6 fine-tune recipe (see notebooks/)
model:
  max_seq_len: 64
  d_model: 384
  enc_layers: 6
  dec_layers: 6
  n_heads: 6
  ffn_dim: 1024
  embed_dim: 192
  dropout: 0.25

data:
  comp_dir: data/raw/asl-fingerspelling
  npy_train: data/processed/npy_train
  npy_supp: data/processed/npy_supp
  use_supplemental: true
  split_seed: 42

train:
  batch_size: 96
  epochs: 30
  lr: 5.0e-5
  weight_decay: 1.0e-4
  warmup_epochs: 2
  scheduler: cosine
  label_smoothing: 0.2
  patience: 10
  out_dir: checkpoints/v6

decode:
  beam_width: 5
  length_penalty: 0.6
