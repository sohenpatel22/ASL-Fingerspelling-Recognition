# second stage of the scratch run: restart from its weights with a fresh cosine schedule for 40 more epochs
model:
  max_seq_len: 192
  dropout: 0.1
  ctc: true

data:
  use_supplemental: true
  split_seed: 42
  augment: heavy
  cutmix: 0.5

train:
  batch_size: 96
  epochs: 40
  lr: 3.0e-4
  weight_decay: 0.05
  warmup_epochs: 1
  scheduler: cosine
  label_smoothing: 0.0
  decoder_mask: 0.2
  ctc_weight: 0.25
  ema_decay: 0.999
  patience: 12
  eval_samples: 1000
  num_workers: 4
  init_from: null
  out_dir: checkpoints/continue
